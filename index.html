<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الفسحة 🍿</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- القائمة الجانبية -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>الأقسام</h2>
            <button class="close-btn" id="closeBtn"><i class="fas fa-times"></i></button>
        </div>
        <ul>
            <li onclick="showSection('home')"><i class="fas fa-home"></i> الرئيسية</li>
            <li onclick="showSection('library')"><i class="fas fa-book"></i> مكتبتي</li>
            <li onclick="showSection('live')"><i class="fas fa-tv"></i> البث المباشر</li>
            <li onclick="showSection('nostalgia')"><i class="fas fa-history"></i> نستالجيا</li>
            <li onclick="showSection('download')"><i class="fas fa-download"></i> تحميل التطبيق</li>
        </ul>
    </div>

    <!-- الهيدر -->
    <header>
        <div class="menu-icon" id="menuBtn"><i class="fas fa-bars"></i></div>
        <div class="logo">
            <h1>الفسحة 🍿</h1>
        </div>
        <div style="width: 40px;"></div> <!-- عشان يتوسط الشعار -->
    </header>

    <!-- المحتوى الرئيسي -->
    <main>
        <!-- قسم الرئيسية -->
        <section id="home" class="section active">
            <h2>الرئيسية</h2>
            <p>هذا القسم فاضي حالياً.</p>
        </section>

        <!-- قسم مكتبتي -->
        <section id="library" class="section">
            <h2>مكتبتي</h2>
            <p>هذا القسم فاضي حالياً.</p>
        </section>

        <!-- قسم البث المباشر -->
        <section id="live" class="section">
            <h2>البث المباشر</h2>
            <p>هذا القسم فاضي حالياً.</p>
        </section>

        <!-- قسم نستالجيا -->
        <section id="nostalgia" class="section">
            <h2>نستالجيا</h2>
            <p>هذا القسم فاضي حالياً.</p>
        </section>

        <!-- قسم تحميل التطبيق -->
        <section id="download" class="section">
            <h2>تحميل التطبيق</h2>
            <p>هذا القسم فاضي حالياً.</p>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
